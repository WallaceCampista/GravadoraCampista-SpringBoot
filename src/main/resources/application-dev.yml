spring:
  datasource:
    # valores padrão batem com o container mysql-gravadora (ver README); sobrescreva com variáveis de ambiente
    url: ${DB_URL:jdbc:mysql://localhost:3306/bancogravadora}
    username: ${DB_USERNAME:Wallace}
    password: ${DB_PASSWORD:Senha123.}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      # maior arquivo aceito (o MP3); o limite de cada tipo fica em api.midia
      max-file-size: 20MB
      max-request-size: 21MB

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key}

  jwt:
    token:
      expiration: 2
    refresh-token:
      expiration: 240

  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123}
    email: ${ADMIN_EMAIL:admin@gravadoracampista.com}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  # popula um banco vazio com bandas, álbuns e músicas de exemplo
  dados-exemplo: ${DADOS_EXEMPLO:true}

  # pasta onde ficam as imagens e os MP3 enviados (fora do Git; caminho relativo à pasta em que a API roda)
  midia:
    pasta: ${MIDIA_PASTA:uploads}
    limite-imagem: 5MB
    limite-audio: 20MB

logging:
  level:
    # a jaudiotagger escreve uma linha para cada MP3 lido
    org.jaudiotagger: WARN

server:
  error:
    include-exception: true
  tomcat:
    # sem isso, um envio acima do limite derruba a conexão em vez de responder 413 com a mensagem
    max-swallow-size: 100MB
